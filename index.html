<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil GitHub</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <img
          class="profile-avatar"
          src="https://via.placeholder.com/180x180"
          id="avatar"
          alt="."
        />
        <h1 class="profile-name" id="name"></h1>
        <h2 class="profile-username" id="username"></h2>
        <ul class="numbers">
          <li class="numbers-item">
            <h4>Repositories</h4>
            <span id="repos"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguidores</h4>
            <span id="followers"></span>
          </li>
          <li class="numbers-item">
            <h4>Seguindo</h4>
            <span id="following"></span>
          </li>
        </ul>
        <a href="#" id="link" class="profile-link">Ver no Github</a>
      </div>
    </header>

    <script>
      // Aqui Aguarda o carregamento completo do HTML antes de executar o script
      document.addEventListener("DOMContentLoaded", async function () {
        // Captura os elementos do HTML que serão atualizados com os dados do GitHub
        const nameElement = document.querySelector("#name");
        const usernameElement = document.querySelector("#username");
        const avatarElement = document.querySelector("#avatar");
        const reposElement = document.querySelector("#repos");
        const followersElement = document.querySelector("#followers");
        const followingElement = document.querySelector("#following");
        const linkElement = document.querySelector("#link");

        // Função assíncrona busca os dados do perfil do GitHub
        async function fetchGitHubProfile(username) {
          try {
            // Faz a requisição à API do GitHub
            const response = await fetch(
              `https://api.github.com/users/${username}`
            );

            // Verifica se a resposta da requisição foi sucedida
            if (!response.ok) {
              throw new Error(
                `Erro na requisição: ${response.status} - ${response.statusText}`
              );
            }

            // Converte a resposta para JSON
            const json = await response.json();

            // Verifica se o usuário foi encontrado
            if (!json.login) {
              throw new Error("Usuário não encontrado");
            }

            // Aqui atualiza os elementos da página com os dados do GitHub
            nameElement.innerText = json.name || "Nome não disponível";
            usernameElement.innerText = json.login;
            avatarElement.src =
              json.avatar_url || "https://via.placeholder.com/180x180";
            followingElement.innerText = json.following;
            followersElement.innerText = json.followers;
            reposElement.innerText = json.public_repos;
            linkElement.href = json.html_url;
          } catch (error) {
            // Captura e exibe os erros no console e na página
            console.error("Erro ao buscar perfil do GitHub:", error.message);
            nameElement.innerText = "Erro ao carregar perfil";
          }
        }

        // Chama a função passando o nome do usuário do GitHub
        fetchGitHubProfile("aleoteixeira");
      });
    </script>
  </body>
</html>
